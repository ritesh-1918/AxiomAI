<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - AxiomAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #0d1117;
            --bg-card: rgba(13, 17, 23, 0.9);
            --accent-primary: #00d4ff;
            --accent-secondary: #1fb6d4;
            --accent-glow: rgba(0, 212, 255, 0.3);
            --accent-subtle: rgba(0, 212, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --text-muted: #6b7280;
            --border-color: rgba(0, 212, 255, 0.2);
            --gradient-accent: linear-gradient(135deg, #00d4ff 0%, #1fb6d4 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-gradient {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0a1628 0%, #0d1117 50%, #0a0e1a 100%);
            z-index: -2;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -1;
        }

        .bg-glow {
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
            z-index: -1;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 48px 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .logo-text {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .auth-title {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-title h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .auth-title p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-subtle);
        }

        .btn {
            width: 100%;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            background: var(--gradient-accent);
            color: var(--bg-primary);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--accent-glow);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.875rem;
            display: none;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .message.success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <span class="logo-text">AxiomAI</span>
            </div>

            <div class="auth-title">
                <h1>Set New Password</h1>
                <p>Enter your new password below</p>
            </div>

            <div id="message" class="message"></div>

            <form id="updateForm" onsubmit="handleUpdate(event)">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" placeholder="Min 6 characters" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm password" minlength="6" required>
                </div>

                <button type="submit" class="btn" id="submitBtn">Update Password</button>
            </form>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Check if we have a session (Supabase auto-handles hash fragment to session)
        document.addEventListener('DOMContentLoaded', async () => {
            // Supabase JS SDK automatically handles the #access_token fragment parsing
            // and sets the session. We just need to check if user is logged in.
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                // Try to exchange code if present (though usually implicitly handled)
                // If no session, they might have lost the link context
                // document.getElementById('message').textContent = 'Invalid or expired link.';
                // document.getElementById('message').className = 'message error';
                // document.getElementById('message').style.display = 'block';
                // In newer Supabase versions, getSession helps. 
                // If not redirected, maybe show error.
            }
        });

        async function handleUpdate(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('message');

            if (password !== confirm) {
                msg.textContent = 'Passwords do not match';
                msg.className = 'message error';
                msg.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating...';
            msg.style.display = 'none';

            try {
                const { error } = await supabaseClient.auth.updateUser({
                    password: password
                });

                if (error) throw error;

                msg.textContent = 'Password updated successfully! Redirecting...';
                msg.className = 'message success';
                msg.style.display = 'block';

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            } catch (error) {
                msg.textContent = error.message;
                msg.className = 'message error';
                msg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Update Password';
            }
        }
    </script>
</body>

</html>

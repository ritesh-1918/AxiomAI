<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AxiomAI</title>
    <!-- Supabase SDK - must load before our scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-container">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="auth-card glass-panel">
            <h1>🧠 AxiomAI</h1>
            <p class="subtitle">Sign in to access the dashboard</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" value="demo@axiom.ai" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" value="demo123" required>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Sign In</button>
                    <button type="button" class="btn btn-outline" style="flex: 1;" onclick="handleSignup()">Sign
                        Up</button>
                </div>
            </form>

            <p class="auth-footer">
                Demo credentials are pre-filled. Just click "Sign In"!
            </p>
        </div>
    </div>

    <!-- Scripts load in correct order: SDK already in head, then our code -->
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>

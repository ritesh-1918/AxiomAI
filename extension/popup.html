<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px;
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        .header {
            padding: 16px;
            background: linear-gradient(135deg, #6366f1, #0ea5e9);
            text-align: center;
        }

        .header h1 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.8;
        }

        .content {
            padding: 16px;
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #1e293b;
            color: #f8fafc;
            font-size: 14px;
            resize: none;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #6366f1, #0ea5e9);
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: #1e293b;
            border-radius: 8px;
        }

        .result.visible {
            display: block;
        }

        .tier {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .tier.large {
            background: linear-gradient(135deg, #f43f5e, #ec4899);
        }

        .tier.small {
            background: linear-gradient(135deg, #10b981, #0ea5e9);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: #94a3b8;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 600;
        }

        .footer {
            padding: 12px;
            text-align: center;
            font-size: 11px;
            color: #64748b;
            border-top: 1px solid #334155;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>🧠 AxiomAI</h1>
        <p>Intelligent LLM Router</p>
    </div>
    <div class="content">
        <textarea id="prompt" placeholder="Enter a prompt to analyze..."></textarea>
        <button id="analyzeBtn">🚀 Analyze Prompt</button>
        <div class="result" id="result">
            <div class="tier" id="tier">-</div>
            <div class="stats">
                <div>
                    <div class="stat-label">Confidence</div>
                    <div class="stat-value" id="confidence">-</div>
                </div>
                <div>
                    <div class="stat-label">Latency</div>
                    <div class="stat-value" id="latency">-</div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">AxiomAI v1.0 | Hackathon 2026</div>
    <script src="popup.js"></script>
</body>

</html>
